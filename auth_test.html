<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Firebase Auth Test</title>
</head>
<body>
<h2>Firebase Auth テスト</h2>
<div id="status">初期化中...</div>
<div id="userInfo"></div>
<hr>
<input type="email" id="email" placeholder="メール" style="display:block;margin:8px 0;padding:6px;width:280px">
<input type="password" id="pass" placeholder="パスワード" style="display:block;margin:8px 0;padding:6px;width:280px">
<button id="loginBtn" style="padding:8px 16px;background:#1a73e8;color:#fff;border:none;cursor:pointer">ログイン</button>
<button id="logoutBtn" style="padding:8px 16px;margin-left:8px;cursor:pointer">ログアウト</button>
<div id="log" style="margin-top:12px;font-size:12px;color:#555;white-space:pre-wrap"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-auth.js";

function log(msg){ document.getElementById('log').textContent += new Date().toISOString().slice(11,19)+' '+msg+'\n'; }

const app = initializeApp({
  apiKey: "AIzaSyAKeM-ID2Zi5Rmx5ihLb1Osk64WvQssb4A",
  authDomain: "caramanagerdiary.firebaseapp.com",
  databaseURL: "https://caramanagerdiary-default-rtdb.firebaseio.com",
  projectId: "caramanagerdiary",
  storageBucket: "caramanagerdiary.firebasestorage.app",
  messagingSenderId: "296395564903",
  appId: "1:296395564903:web:8db67477a693a8378571c2"
});
const auth = getAuth(app);
log('Firebase初期化完了');

setPersistence(auth, browserLocalPersistence).then(()=>log('Persistence設定完了')).catch(e=>log('Persistenceエラー: '+e.message));

onAuthStateChanged(auth, user=>{
  if(user){
    document.getElementById('status').textContent = 'ログイン済み: '+user.email;
    document.getElementById('status').style.color='#2e7d32';
    log('onAuthStateChanged: ログイン済み '+user.email);
  } else {
    document.getElementById('status').textContent = '未ログイン';
    document.getElementById('status').style.color='#e53935';
    log('onAuthStateChanged: 未ログイン');
  }
});

document.getElementById('loginBtn').onclick = async()=>{
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  log('ログイン試行: '+email);
  try{
    await setPersistence(auth, browserLocalPersistence);
    const cred=await signInWithEmailAndPassword(auth,email,pass);
    log('ログイン成功: '+cred.user.email);
  }catch(e){log('ログインエラー: '+e.code+' '+e.message);}
};
document.getElementById('logoutBtn').onclick = async()=>{
  await signOut(auth);
  log('ログアウト完了');
};
</script>
</body>
</html>
